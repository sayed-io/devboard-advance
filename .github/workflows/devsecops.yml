name: Devsecops
on: 
    push:
        branches: [main]
jobs:
    ## ----------------- CI ------------------
    code-quality:
        uses: ./.github/workflows/code-quality.yml
    
    secrets-scanning:
        uses: ./.github/workflows/secrets-scanning.yml

    dependency-scan:
        uses: ./.github/workflows/dependency-scan.yml

    docker-scan:
        uses: ./.github/workflows/docker-scan.yml    
        secrets: inherit
    
    sonar-scan:
        uses: ./.github/workflows/sonar-scan.yml    
        secrets: inherit
    code-tests:
        uses: ./.github/workflows/code-tests.yml    
    
    docker-push:
        uses: ./.github/workflows/docker-push.yml
        needs: [code-quality,code-tests,secrets-scanning,dependency-scan,docker-scan,sonar-scan]
        secrets: inherit

        ## -------------------- CD -----------------------
    
    deploy:
        needs: [docker-push]
        uses: ./.github/workflows/deploy.yml
        secrets: inherit