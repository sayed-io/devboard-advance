name: Sonar Qube Scan
on: 
    workflow_call:
jobs:
    sonar-scanner:
        runs-on: ubuntu-latest
        steps: 
            - name: sonar-scan
              uses: actions/checkout@v7
              
            - name: SonarQube Scan
              uses: SonarSource/sonarqube-scan-action@v8.4.1 # Ex: v8.3.0 or sha1, See the latest version at https://github.com/marketplace/actions/official-sonarqube-scan
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                SONAR_HOST_URL: ${{secrets.SONAR_HOST_URL}}

