name: Docker Scan

on:
  workflow_call:

jobs:
  docker-file-linting-image-scanning:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        folder: ['backend', 'frontend']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run Hadolint Linter
        uses: hadolint/hadolint-action@v3.1.0
        with:
          # Path to your Dockerfile
          dockerfile: ${{ matrix.folder }}/dockerfile

          # Severity level at which the linter fails
          failure-threshold: warning