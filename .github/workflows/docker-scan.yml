
name: Docker Scan

on:
  workflow_call:

jobs:
  docker-file-linting-image-scanning:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        folders: [backend, frontend]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Hadolint Linter
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.folders }}/Dockerfile
          failure-threshold: warning

      - name: Build Docker Image
        run: |
          docker build \
            -t devboard-${{ matrix.folders }}:latest .
        working-directory: ${{ matrix.folders }}

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devboard-${{ matrix.folders }}:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
